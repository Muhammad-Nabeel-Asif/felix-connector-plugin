name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs still run tests. The release job is main-only and needs write
# to create a GitHub Release + tag (merging to main does not do that).
jobs:
  test-and-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: sodium, zip
          coverage: none

      - name: Run behavioral tests
        run: php tests/run.php

      - name: Build release ZIP
        run: bash scripts/build-zip.sh

      - name: Fail if UI-referenced files are missing from the ZIP
        run: php scripts/assert-zip-contents.php dist/felix-connector.zip

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: felix-connector
          path: dist/felix-connector.zip

  release:
    name: Publish GitHub Release
    needs: test-and-zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: felix-connector
          path: dist

      - name: Create GitHub Release for new plugin version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-github-release.sh
